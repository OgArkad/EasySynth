<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>easySynth</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="./favicon.png">

    <script type="module" src="src/script.js"></script>
    <script type="module" src="src/MIDI.js"></script>
    <script type="module" src="src/UI.js"></script>
    <script type="module" src="src/oscilloscope.js"></script>
    <script type="module" src="src/piano.js"></script>
    <script type="module" src="src/sampleOptions.js"></script>
</head>
<body>
    <div id="start">Start</div>
    <div class="synth-chassis">
        <div id="oscilloscope">
            <canvas id="oscilloscope-canvas"></canvas>
        </div>
            <img src="./media/wave.png" class="viz-btn" data-mode="waveform" id="viz-wave" alt="wave">
            <img src="./media/FFT.png" class="viz-btn" data-mode="fft" id="viz-FFT" alt="fft">
            <img src="./media/Stereo.png" class="viz-btn" data-mode="xy" id="viz-stereo" alt="stereo">

        <div id="tempo">
            <p id="tempoValue">120</p>
            <img src="./media/tempoAside.png" id="tempoAside">
            <img src="./media/buttonUp.png" alt="up" class="tempoButton" id="tempoUp">
            <img src="./media/buttonDown.png" alt="down" class="tempoButton" id="tempDown">
        </div>
        <img src="./media/Play.png" alt="play" class="media" id="play">
        <img src="./media/Pause.png" alt="pause" class="media" id="pause">
        <img src="./media/Record.png" alt="record" class="media" id="record">

        <div class="switch-control" style="top: 20%; left: 40%;">
            <p>UNISON</p>
            <div class="switch-wrapper">
                <img src="./media/NutOfTheSwitch.png" alt="switch" id="unison-switch" class="switch-nut">
                <img src="./media/switchLeft.png" alt="left" class="switch" data-works="off">
            </div>
        </div>

        <div class="switch-control" style="top: 20%; left: 45%;">
            <p>EFFECT</p>
            <div class="switch-wrapper">
                <img src="./media/NutOfTheSwitch.png" alt="switch" id="effect-switch" class="switch-nut">
                <img src="./media/switchLeft.png" alt="left" class="switch" data-works="off">
            </div>
        </div>

        <div class="switch-control" style="top: 36%; left: 40.5%;">
            <p>LFO</p>
            <div class="switch-wrapper">
                <img src="./media/NutOfTheSwitch.png" alt="switch" id="lfo-switch" class="switch-nut">
                <img src="./media/switchLeft.png" alt="left" class="switch" data-works="off">
            </div>
        </div>

        <div class="slider-control" style="top: 38%; left: 46%;">
            <p>DETUNE</p>
            <div class="slider-wrapper">
                <img src="./media/slider.png" alt="slider" class="slider">
                <img src="./media/cap.png" alt="cap" class="cap" id="detune-cap">
            </div>
        </div>

        <div class="slider-control" style="top: 38%; left: 52%;">
            <p>SPREAD</p>
            <div class="slider-wrapper">
                <img src="./media/slider.png" alt="slider" class="slider">
                <img src="./media/cap.png" alt="cap" class="cap" id="spread-cap">
            </div>
        </div>

        <select name="samples" id="sampleOptions">
            <option value="default" selected>default</option>
        </select>
        <img src="./add.png" alt="add" id="sampleAddOptions">

        <div class="knob-control" style="top: 25%; right: 46%;">
            <p>FILTER</p>
            <img src="./knob.png" id="filter-knob" class="knob-image" alt="filter">
        </div>
        <div class="knob-control" style="top: 25%; right: 39%;">
            <p>WAVEFORM</p>
            <img src="./knob.png" id="waveform-knob" class="knob-image" alt="waveform">
        </div>
        <div class="knob-control" style="top: 25%; right: 32%;">
            <p>EFFECT</p>
            <img src="./knob.png" id="effect-knob" class="knob-image" alt="effect">
        </div>
        <div class="knob-control" style="top: 25%; right: 25%;">
            <p>GAIN</p>
            <img src="./knob.png" id="gain-knob" class="knob-image" alt="gain">
        </div>

        <div class="knob-control" style="top: 40%; right: 32%;">
            <p>CUTOFF</p>
            <img src="./knob.png" id="cutoff-knob" class="knob-image" alt="cutoff">
        </div>

        <div class="knob-control" style="top: 55%; right: 32%;">
            <p>OCTAVE</p>
            <img src="./knob.png" id="octave-knob" class="knob-image" alt="octave">
        </div>
        <div class="knob-control" style="top: 55%; right: 25%;">
            <p>SEMITONE</p>
            <img src="./knob.png" id="semitone-knob" class="knob-image" alt="semitone">
        </div>
        <div class="knob-control" style="top: 55%; right: 18%;">
            <p>FINE TUNING</p>
            <img src="./knob.png" id="fine-tuning-knob" class="knob-image" alt="fine tuning">
        </div>

        <div class="knobSegment" id="asdr">
            <span class="segment-label">ADSR</span>
        </div>
        <div class="knob-control" style="top: 70%; right: 32%;">
            <p>ATTACK</p>
            <img src="./knob.png" id="attack-knob" class="knob-image" alt="attack">
        </div>
        <div class="knob-control" style="top: 70%; right: 25%;">
            <p>DECAY</p>
            <img src="./knob.png" id="decay-knob" class="knob-image" alt="decay">
        </div>
        <div class="knob-control" style="top: 70%; right: 18%;">
            <p>SUSTAIN</p>
            <img src="./knob.png" id="sustain-knob" class="knob-image" alt="sustain">
        </div>
        <div class="knob-control" style="top: 70%; right: 11%;">
            <p>RELEASE</p>
            <img src="./knob.png" id="release-knob" class="knob-image" alt="release">
        </div>
    </div>
</body>
</html>
